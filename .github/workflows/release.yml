name: Build and publish Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Create one release before uploading artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases"
          try {
            Invoke-RestMethod -Uri "$api/tags/$env:GITHUB_REF_NAME" -Headers $headers | Out-Null
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            $body = @{
              tag_name = $env:GITHUB_REF_NAME
              name = $env:GITHUB_REF_NAME
              draft = $false
              prerelease = $false
            } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri $api -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
      - run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
